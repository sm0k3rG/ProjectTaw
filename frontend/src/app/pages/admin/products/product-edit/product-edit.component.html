<!-- Confirmación de producto actualizado -->
<div
  *ngIf="success"
  class="alert alert-success position-fixed top-0 end-0 m-3"
  role="alert"
>
  ¡Producto actualizado correctamente!
</div>

<!-- Spinner de carga -->
<div *ngIf="loading" class="text-center py-5">
  <div class="spinner-border" role="status"></div>
  <p class="mt-3 text-muted">Cargando datos…</p>
</div>

<!-- Error al cargar -->
<div *ngIf="error && !loading" class="text-center py-5">
  <i class="bi bi-exclamation-triangle display-1 text-warning"></i>
  <h4 class="text-warning mt-3">Error al cargar el producto</h4>
  <button class="btn btn-primary" (click)="loadProduct()">
    <i class="bi bi-arrow-clockwise me-1"></i>Reintentar
  </button>
</div>

<!-- Formulario de edición -->
<div *ngIf="!loading && !error" class="card mx-auto shadow-sm edit-card">
  <div class="card-body">
    <h5 class="card-title mb-4">Editar producto</h5>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <!-- Nombre -->
      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" class="form-control" formControlName="name" />
        <div
          *ngIf="form.get('name')?.invalid && form.get('name')?.touched"
          class="text-danger small"
        >
          Nombre es obligatorio.
        </div>
      </div>

      <!-- Imagen (URL) -->
      <div class="mb-3">
        <label class="form-label">URL de la imagen</label>
        <input type="text" class="form-control" formControlName="image" />
        <div
          *ngIf="form.get('image')?.invalid && form.get('image')?.touched"
          class="text-danger small"
        >
          La URL es obligatoria.
        </div>
      </div>

      <!-- Precio -->
      <div class="input-group mb-3">
        <span class="input-group-text">Precio</span>
        <input type="number" class="form-control" formControlName="price" />
      </div>

      <!-- Descripción -->
      <div class="mb-4">
        <label class="form-label">Descripción</label>
        <textarea
          rows="3"
          class="form-control"
          formControlName="description"
        ></textarea>
      </div>

      <button
        type="submit"
        class="btn btn-primary w-100"
        [disabled]="form.invalid || loading"
      >
        <i class="bi bi-save me-1"></i>Guardar cambios
      </button>
    </form>
  </div>
</div>
