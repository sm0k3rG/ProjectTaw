<div class="delete-container">
  <!-- Cargando usuario -->
  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border" role="status"></div>
    <p class="mt-3 text-muted">Cargando usuario…</p>
  </div>

  <!-- Error al cargar -->
  <div *ngIf="error && !loading" class="text-center py-5">
    <i class="bi bi-exclamation-triangle display-1 text-warning"></i>
    <h4 class="text-warning mt-3">Error al cargar usuario</h4>
    <button class="btn btn-primary" (click)="loadUser()">
      <i class="bi bi-arrow-clockwise me-1"></i>Reintentar
    </button>
  </div>

  <!-- Confirmación éxito -->
  <div *ngIf="success" class="alert alert-success text-center">
    Usuario eliminado correctamente. Volviendo al listado…
  </div>

  <!-- Detalle y botón eliminar -->
  <div *ngIf="user && !loading && !error" class="delete-card mx-auto shadow-sm">
    <div class="card-header">
      <h3>Eliminar Usuario</h3>
    </div>
    <div class="card-body">
      <p><strong>ID:</strong> {{ user.id }}</p>
      <p><strong>Nombre:</strong> {{ user.name }}</p>
      <p><strong>Email:</strong> {{ user.email }}</p>
      <p><strong>Rol:</strong> {{ user.role }}</p>

      <button
        class="btn delete-button w-100"
        (click)="onDelete()"
        [disabled]="processing"
      >
        <ng-container *ngIf="!processing; else sp">
          Eliminar usuario
        </ng-container>
        <ng-template #sp>
          <span class="spinner-border spinner-border-sm"></span>
          Eliminando…
        </ng-template>
      </button>

      <button routerLink="/admin/users" class="btn btn-secondary w-100 mt-2">
        ← Volver al listado
      </button>
    </div>
  </div>
</div>
