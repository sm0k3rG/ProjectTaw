<div *ngIf="loading" class="text-center py-5">
  <div class="spinner-border"></div>
  <p class="mt-3 text-muted">Cargando datos…</p>
</div>

<div *ngIf="error && !loading" class="text-center text-danger">
  Error al cargar la información. Intenta nuevamente.
</div>

<div *ngIf="!loading && !error" class="additional-container">
  <div class="additional-card shadow-sm">
    <h2 class="card-title">Información Adicional</h2>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">Teléfono alternativo</label>
        <input formControlName="altPhone" class="form-control" />
      </div>
      <div class="mb-3">
        <label class="form-label">Dirección secundaria</label>
        <input formControlName="secondaryAddress" class="form-control" />
      </div>
      <div class="mb-3">
        <label class="form-label">Preferencias de entrega</label>
        <input formControlName="deliveryPrefs" class="form-control" />
      </div>
      <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
        {{ success ? "Guardado ✓" : "Guardar información" }}
      </button>
      <div *ngIf="success" class="alert alert-success mt-3 text-center">
        Guardado correctamente. Volviendo a perfil…
      </div>
    </form>
  </div>
</div>
