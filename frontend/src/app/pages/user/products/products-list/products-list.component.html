<app-main-navbar type="user"></app-main-navbar>
<!-- Estado de carga -->
<div class="text-center py-5" *ngIf="loading">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Cargando...</span>
  </div>
  <p class="mt-3 text-muted">Cargando productos...</p>
</div>

<!-- Estado de error -->
<div class="text-center py-5" *ngIf="error">
  <i class="bi bi-exclamation-triangle display-1 text-warning"></i>
  <h4 class="text-warning mt-3">Error al cargar productos</h4>
  <p class="text-muted">Intenta recargar la página</p>
  <button class="btn btn-primary" (click)="loadProducts()">
    <i class="bi bi-arrow-clockwise me-2"></i>Reintentar
  </button>
</div>

<!-- Lista de productos -->
<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" *ngIf="!loading && !error">
  <div class="col" *ngFor="let product of products">
    <div class="card h-100 shadow-sm product-card">
      <div class="card-img-wrapper">
        <img [src]="product.image"
             [alt]="product.name"
             class="card-img-top">
        <div class="card-overlay">
          <button class="btn btn-primary btn-sm"
                  (click)="addToCart(product)">
            <i class="bi bi-cart-plus me-1"></i>
            Agregar
          </button>
        </div>
      </div>

      <div class="card-body d-flex flex-column">
        <h5 class="card-title">{{ product.name }}</h5>
        <p class="card-text text-muted flex-grow-1" *ngIf="product.description">
          {{ product.description }}
        </p>
        <div class="mt-auto">
          <div class="d-flex justify-content-between align-items-center">
            <span class="h5 text-primary mb-0">${{ product.price | number:'1.2-2' }}</span>
            <button class="btn btn-outline-primary btn-sm"
                    (click)="addToCart(product)">
              <i class="bi bi-cart-plus me-1"></i>
              Agregar
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Mensaje cuando no hay productos -->
<div class="text-center py-5" *ngIf="!loading && !error && products.length === 0">
  <i class="bi bi-box display-1 text-muted"></i>
  <h4 class="text-muted mt-3">No hay productos disponibles</h4>
  <p class="text-muted">Intenta más tarde</p>
</div>
