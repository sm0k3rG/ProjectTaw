<div class="container mt-4">
  <!-- Estado de carga -->
  <div class="text-center py-5" *ngIf="loading">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <p class="mt-3 text-muted">Cargando producto...</p>
  </div>

  <!-- Estado de error -->
  <div class="text-center py-5" *ngIf="error">
    <i class="bi bi-exclamation-triangle display-1 text-warning"></i>
    <h4 class="text-warning mt-3">Error al cargar el producto</h4>
    <p class="text-muted">Intenta recargar la página</p>
    <button class="btn btn-primary" (click)="loadProduct()">
      <i class="bi bi-arrow-clockwise me-2"></i>Reintentar
    </button>
  </div>

  <!-- Detalle del producto -->
  <div class="row" *ngIf="!loading && !error && product">
    <!-- Imagen del producto -->
    <div class="col-md-6">
      <div class="product-image-container">
        <img [src]="product.image"
             [alt]="product.name"
             class="img-fluid rounded shadow">
      </div>
    </div>

    <!-- Información del producto -->
    <div class="col-md-6">
      <h2 class="mb-3">{{ product.name }}</h2>

      <!-- Precio -->
      <div class="mb-3">
        <span class="h3 text-primary">${{ product.price | number:'1.2-2' }}</span>
      </div>

      <!-- Descripción -->
      <div class="mb-4" *ngIf="product.description">
        <h5>Descripción</h5>
        <p class="text-muted">{{ product.description }}</p>
      </div>

      <!-- Cantidad y botones -->
      <div class="mb-4">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Cantidad</label>
            <input type="number"
                   class="form-control"
                   [(ngModel)]="selectedQuantity"
                   min="1"
                   (change)="onQuantityChange($event)">
          </div>
          <div class="col-md-8">
            <label class="form-label">&nbsp;</label>
            <div class="d-grid gap-2">
              <button class="btn btn-primary btn-lg"
                      (click)="addToCart()">
                <i class="bi bi-cart-plus me-2"></i>
                Agregar al Carrito
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
